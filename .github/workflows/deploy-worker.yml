name: Deploy auth worker to Cloudflare

on:
  push:
    branches: [main]
    paths: ["worker/**", "wrangler.toml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --var SIGNAL_JWT_SECRET:${{ secrets.SIGNAL_JWT_SECRET }}
