<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Praxion Control</title>
<style>
:root{--bg:#05070d;--panel:#0b1020;--stroke:#1c2a44;--text:#c8d8f0;--dim:#5a6b85;--glow:#7ee0ff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:radial-gradient(1200px 800px at 50% -10%,#0a1226 0%,#05070d 60%);color:var(--text);font-family:ui-monospace,Menlo,monospace;overflow:hidden}
.layout{display:flex;height:100vh}
.sidebar{width:280px;flex-shrink:0;background:#070b16;border-right:1px solid var(--stroke);display:flex;flex-direction:column;height:100%}
.sidebar .head{padding:16px 18px;border-bottom:1px solid var(--stroke)}
.sidebar .head h1{font-size:16px;letter-spacing:2px;color:#eaf6ff;text-shadow:0 0 14px rgba(126,224,255,.5)}
.sidebar .head .sub{color:var(--dim);font-size:10px;margin-top:3px}
.agents{flex:1;overflow-y:auto;padding:10px}
.agent{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;cursor:pointer;margin-bottom:6px;border:1px solid transparent;transition:.15s}
.agent:hover{background:rgba(126,224,255,.06);border-color:rgba(126,224,255,.2)}
.agent.active{background:rgba(126,224,255,.1);border-color:var(--glow)}
.agent .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.dot.live{background:var(--glow);box-shadow:0 0 10px var(--glow)}
.dot.down{background:#ff5f6d}
.agent .nm{font-weight:600;font-size:13px;line-height:1.2}
.agent .rl{color:var(--dim);font-size:10px}
.mbox{border:1px solid var(--stroke);border-radius:10px;padding:8px;margin-bottom:12px;background:rgba(255,255,255,.015)}
.mhead{display:flex;align-items:center;gap:7px;padding:2px 4px 8px;border-bottom:1px solid rgba(28,42,68,.7);margin-bottom:6px}
.mdot{width:8px;height:8px;border-radius:50%;box-shadow:0 0 8px currentColor}
.mname{font-weight:700;font-size:12px;letter-spacing:.5px}
.mcount{margin-left:auto;color:var(--dim);font-size:10px}
.vpsdot{width:8px;height:8px;border-radius:50%;margin-left:6px}
.vpsdot.up{background:#7bed9f;box-shadow:0 0 8px #7bed9f}
.vpsdot.down{background:#ff5f6d}
.contactrow{display:flex;justify-content:space-between;align-items:center;padding:6px 4px;margin-top:4px;border-top:1px dashed rgba(28,42,68,.7);font-size:11px}
.clabel{color:var(--dim);font-size:10px;text-transform:uppercase;letter-spacing:1px}
.cname{color:#7ee0ff;font-weight:600}
.powerrow{margin-top:6px}
.pwrbtn{width:100%;padding:6px 10px;border-radius:7px;border:1px solid var(--stroke);font-weight:700;font-size:12px;cursor:pointer;font-family:inherit}
.pwrbtn.on{background:rgba(255,95,109,.12);color:#ff5f6d;border-color:rgba(255,95,109,.4)}
.pwrbtn.off{background:rgba(123,237,159,.1);color:#7bed9f;border-color:rgba(123,237,159,.35)}
.sysrow{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.syschip{font-size:9px;padding:2px 6px;border-radius:6px;background:rgba(255,255,255,.03);border:1px solid var(--stroke);color:var(--dim)}
.s3panel{background:var(--panel);border:1px solid var(--stroke);border-radius:10px;padding:12px;margin-bottom:14px}
.s3panel .s3head{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:12px}
.s3panel .s3head .lbl{color:var(--dim);text-transform:uppercase;letter-spacing:1.5px;font-size:11px}
.s3panel .s3chips{display:flex;flex-wrap:wrap;gap:6px}
.s3chip{font-size:11px;padding:4px 10px;border-radius:8px;background:rgba(126,224,255,.08);border:1px solid rgba(126,224,255,.25);color:var(--text);cursor:pointer}
.s3chip:hover{border-color:var(--glow)}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{padding:12px 20px;border-bottom:1px solid var(--stroke);display:flex;align-items:center;justify-content:space-between}
.topbar .t{font-size:13px;font-weight:700;color:var(--glow);letter-spacing:1px}
.topbar .stat{color:var(--dim);font-size:12px}
.graph-wrap{height:26%;min-height:120px;border-bottom:1px solid var(--stroke);position:relative;background:linear-gradient(180deg,rgba(126,224,255,.02),transparent);transition:height .18s ease}
.graph-wrap.collapsed{height:34px;min-height:34px;overflow:hidden}
.graph-wrap.collapsed canvas,.graph-wrap.collapsed .nflow{display:none}
.graph-toggle{position:absolute;top:6px;right:10px;z-index:5;background:rgba(255,255,255,.06);border:1px solid var(--stroke);color:var(--dim);font-size:10px;letter-spacing:1px;padding:3px 8px;border-radius:6px;cursor:pointer;font-family:inherit}
.graph-toggle:hover{color:var(--text);border-color:var(--glow)}
.graph-wrap canvas{position:absolute;inset:0;width:100%;height:100%}
.graph-wrap .glabel{position:absolute;top:8px;left:16px;font-size:11px;letter-spacing:2px;color:var(--dim);text-transform:uppercase;z-index:3}
.nflow{position:absolute;left:0;right:0;bottom:0;top:0;display:flex;align-items:center;justify-content:center;gap:8px;padding:30px 20px;overflow-x:auto;z-index:2;flex-wrap:nowrap}
.nfnode{flex-shrink:0;background:var(--panel);border:1px solid var(--stroke);border-radius:10px;padding:10px 14px;min-width:110px;max-width:170px;text-align:center;box-shadow:0 0 0 rgba(0,0,0,0)}
.nfnode .nl{font-size:12px;font-weight:700;color:var(--text)}
.nfnode .ns{font-size:9px;color:var(--dim);margin-top:3px;line-height:1.3}
.nfedge{flex-shrink:0;color:var(--dim);font-size:14px}
.plwrap{flex:1;min-height:0;overflow-y:auto;padding:16px}
.plhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;position:relative}
.plhead .glabel{font-size:11px;letter-spacing:2px;color:var(--dim);text-transform:uppercase}
.hiddenchip{font-size:11px;color:var(--dim);cursor:pointer;border:1px solid var(--stroke);border-radius:8px;padding:4px 9px}
.hiddenchip:hover{color:var(--glow);border-color:var(--glow)}

/* ---- ORB Fleet status ---- */
.fleet{margin-bottom:14px;border:1px solid var(--stroke);border-radius:10px;background:var(--panel);padding:12px 14px}
.fleethead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.fleethead .glabel{font-size:11px;letter-spacing:2px;color:var(--dim);text-transform:uppercase}
.fleethead .fagen{font-size:10px;color:var(--dim)}
.fleetrow{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid rgba(255,255,255,.05)}
.fleetrow:first-of-type{border-top:none}
.fdot{width:9px;height:9px;border-radius:50%;flex-shrink:0;box-shadow:0 0 8px currentColor}
.fdot.green{background:#3ddc84;color:#3ddc84}
.fdot.yellow{background:#ffc23d;color:#ffc23d}
.fdot.red{background:#ff5f6d;color:#ff5f6d}
.fname{font-size:12px;font-weight:700;min-width:118px}
.facct{font-size:10px;color:var(--dim);font-variant-numeric:tabular-nums}
.fbal{margin-left:auto;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.fbal.pos{color:#3ddc84}.fbal.neg{color:#ff5f6d}
.fpnl{font-size:9px;font-weight:600;letter-spacing:.3px;margin-top:1px;opacity:.85}
.fpnl.pos{color:#3ddc84}.fpnl.neg{color:#ff5f6d}
.fmeta{font-size:10px;color:var(--dim);text-align:right;min-width:92px;line-height:1.5}
.fmeta .ok{color:#3ddc84}.fmeta .warn{color:#ffc23d}.fmeta .bad{color:#ff5f6d}
.fnote{font-size:10px;color:#ffc23d;padding-left:21px}
.fiso{font-size:10px;margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.05)}
.fiso .ok{color:#3ddc84}.fiso .bad{color:#ff5f6d}

/* ---- settings cog ---- */
.cog{background:none;border:none;color:var(--dim);font-size:16px;cursor:pointer;padding:2px 6px;border-radius:6px;line-height:1}
.cog:hover{color:var(--glow);background:rgba(126,224,255,.08)}
.cog.active{color:var(--glow);background:rgba(126,224,255,.14)}
.sdrawer{position:fixed;top:0;right:0;bottom:0;width:320px;max-width:88vw;background:#080d18;border-left:1px solid var(--stroke);z-index:60;display:none;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.5)}
.sdrawer.open{display:flex}
.sdhead{padding:14px 16px;border-bottom:1px solid var(--stroke);display:flex;align-items:center;justify-content:space-between}
.sdhead .t{font-size:12px;font-weight:700;letter-spacing:1px;color:var(--glow)}
.sdhead .x{cursor:pointer;color:var(--dim);font-size:15px;padding:2px 6px}
.sdhead .x:hover{color:var(--text)}
.sdbody{flex:1;overflow-y:auto;padding:12px 16px}
.sdsec{font-size:10px;letter-spacing:2px;color:var(--dim);text-transform:uppercase;margin:14px 0 8px}
.sdsec:first-child{margin-top:0}
.sditem{display:flex;align-items:center;gap:9px;padding:7px 0;font-size:12px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.03)}
.sditem:hover{color:var(--glow)}
.sditem input{cursor:pointer;accent-color:#7ee0ff;width:14px;height:14px}
.sditem .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sdfoot{padding:10px 16px;border-top:1px solid var(--stroke);font-size:10px;color:var(--dim);display:flex;gap:8px}
.sdfoot button{flex:1;background:rgba(126,224,255,.1);border:1px solid var(--stroke);color:var(--text);border-radius:6px;padding:6px;font-size:10px;cursor:pointer;font-family:inherit}
.sdfoot button:hover{border-color:var(--glow);color:var(--glow)}
.sdbackdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:55;display:none}
.sdbackdrop.open{display:block}
.hiddenpop{position:absolute;top:28px;right:0;width:280px;background:#0b1222;border:1px solid var(--stroke);border-radius:10px;padding:10px;z-index:30;box-shadow:0 8px 30px rgba(0,0,0,.6)}
.hiddenpop .hitem{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 4px;font-size:12px;border-bottom:1px solid rgba(28,42,68,.6)}
.hiddenpop .hitem:last-child{border-bottom:none}
.hiddenpop .restore{cursor:pointer;color:var(--glow);font-size:11px}
.hiddenpop .restoreall{margin-top:8px;text-align:center;color:var(--dim);cursor:pointer;font-size:11px}
.hiddenpop .restoreall:hover{color:var(--glow)}
.plgrid{display:flex;flex-wrap:wrap;gap:12px}.plgrid .pbox{width:240px;flex-shrink:0}
.rowwrap{display:block;width:100%;margin-bottom:14px}
.rowwrap .plgrid{display:flex;flex-wrap:wrap;gap:12px;width:100%}
.rowlabel{font-size:11px;letter-spacing:2px;color:var(--dim);text-transform:uppercase;margin-bottom:8px}
.pbox{background:var(--panel);border:1px solid var(--stroke);border-radius:10px;padding:13px;position:relative;overflow:hidden;transition:.15s;cursor:grab}
.pbox:hover{border-color:var(--glow);box-shadow:0 0 16px rgba(126,224,255,.12)}
.pbox.dragging{opacity:.35;border-style:dashed}
.pbox .pname{font-weight:700;font-size:13px;margin-bottom:2px;word-break:break-word;padding-right:16px}
.pbox .pown{color:var(--dim);font-size:11px;margin-bottom:6px}
.pbox .prow{display:flex;justify-content:space-between;font-size:11px;padding:2px 0}
.pbox .prow span:last-child{font-weight:600}
.pbox .pval{font-size:16px;font-weight:700;margin-top:6px;cursor:pointer}
.pbox .ctlbtn{display:block;width:100%;margin-top:8px;padding:6px 10px;border-radius:7px;border:none;font-weight:700;font-size:12px;cursor:pointer;font-family:inherit}
.pbox .ctlbtn.start{background:var(--glow);color:#04101a}
.pbox .ctlbtn.stop{background:#ff5f6d;color:#0b0e14}
.pbox .pval:hover{text-decoration:underline dotted}
.pos{color:#7bed9f}.neg{color:#ff5f6d}.mut{color:var(--dim)}
.hidebtn{position:absolute;top:6px;right:8px;color:var(--dim);cursor:pointer;font-size:12px;opacity:.45;z-index:2}
.hidebtn:hover{color:#ff5f6d;opacity:1}
.pnlsummary{display:flex;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.pnlcard{background:var(--panel);border:1px solid var(--stroke);border-radius:10px;padding:12px 16px;min-width:150px}
.pnlcard .lbl{font-size:10px;color:var(--dim);letter-spacing:1px;text-transform:uppercase}
.pnlcard .val{font-size:22px;font-weight:700;margin-top:3px}
/* master P&L folder */
.folder{grid-column:1/-1;background:linear-gradient(180deg,rgba(126,224,255,.05),rgba(11,16,32,.4));border:1px dashed var(--glow);border-radius:12px;padding:12px 14px;transition:.15s}
.folder.droptarget{border-style:solid;box-shadow:0 0 24px rgba(126,224,255,.25)}
.fhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ficon{font-size:16px}
.fname{font-weight:700;font-size:14px;color:#eaf6ff}
.fmeta{color:var(--dim);font-size:11px}
.fpnl{font-size:18px;font-weight:700;margin-left:auto}
.fbtn{font-size:11px;color:var(--dim);cursor:pointer;border:1px solid var(--stroke);border-radius:6px;padding:3px 8px}
.fbtn:hover{color:var(--glow);border-color:var(--glow)}
.fbtn.danger:hover{color:#ff5f6d;border-color:#ff5f6d}
.fmembers{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.mchip{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--stroke);border-radius:8px;padding:6px 10px;cursor:grab;position:relative}
.mchip:hover{border-color:var(--glow)}
.mchip.dragging{opacity:.35;border-style:dashed}
.mchip .mn{font-size:12px;font-weight:600;max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mchip .mpnl{font-size:13px;font-weight:700;cursor:pointer}
.mchip .mpnl:hover{text-decoration:underline dotted}
.mchip .hidebtn{position:static;order:3;font-size:11px}
.fdrop{color:var(--dim);font-size:10px;text-align:center;margin-top:10px;letter-spacing:1px;opacity:.6}
.chat{position:fixed;right:0;top:0;bottom:0;width:400px;background:#070b16;border-left:1px solid var(--stroke);display:flex;flex-direction:column;z-index:20;box-shadow:-10px 0 40px rgba(0,0,0,.5)}
.chat .chead{padding:14px 18px;border-bottom:1px solid var(--stroke);display:flex;align-items:center;justify-content:space-between}
.chat .chead .who{font-weight:700;font-size:14px;color:var(--glow)}
.chat .chead .x{cursor:pointer;color:var(--dim);font-size:16px}
.chat .cbody{flex:1;overflow-y:auto;padding:14px}
.chat .msg{margin-bottom:12px;max-width:92%}
.chat .msg .who{font-size:10px;color:var(--dim);margin-bottom:2px}
.chat .msg .bub{padding:9px 12px;border-radius:10px;font-size:13px;line-height:1.5;word-wrap:break-word}
.chat .msg.user{align-self:flex-end;margin-left:auto}
.chat .msg.user .bub{background:rgba(126,224,255,.12);border:1px solid rgba(126,224,255,.25)}
.chat .msg.agent .bub{background:rgba(255,255,255,.04);border:1px solid var(--stroke)}
.chat .cinput{display:flex;gap:8px;padding:12px;border-top:1px solid var(--stroke)}
.chat .cinput textarea{flex:1;background:#0b1020;border:1px solid var(--stroke);border-radius:8px;color:var(--text);padding:9px;font-family:inherit;font-size:13px;resize:none;height:44px}
.chat .cinput button{background:var(--glow);color:#04101a;border:none;border-radius:8px;padding:0 16px;font-weight:700;cursor:pointer;font-family:inherit}
/* project detail panel */
.detail{position:fixed;right:0;top:0;bottom:0;width:460px;background:#070b16;border-left:1px solid var(--stroke);display:flex;flex-direction:column;z-index:22;box-shadow:-10px 0 40px rgba(0,0,0,.5)}
.detail .dhead{padding:16px 18px;border-bottom:1px solid var(--stroke);display:flex;align-items:center;justify-content:space-between}
.detail .dhead .who{font-weight:700;font-size:15px;color:var(--glow)}
.detail .dhead .x{cursor:pointer;color:var(--dim);font-size:16px}
.detail .dbody{flex:1;overflow-y:auto;padding:16px}
.detail .dsec{margin-bottom:20px}
.detail .dsec h3{font-size:11px;letter-spacing:1.5px;color:var(--dim);text-transform:uppercase;margin-bottom:10px}
.ctl-row{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.btn{background:var(--glow);color:#04101a;border:none;border-radius:8px;padding:8px 18px;font-weight:700;cursor:pointer;font-family:inherit;font-size:13px}
.btn.stop{background:#ff5f6d;color:#0b0e14}
.btn:disabled{opacity:.35;cursor:default}
.status-pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:4px 10px;border-radius:12px}
.status-pill.run{background:rgba(126,224,255,.12);color:#7ee0ff;border:1px solid rgba(126,224,255,.3)}
.status-pill.stop{background:rgba(255,95,109,.1);color:#ff5f6d;border:1px solid rgba(255,95,109,.3)}
.status-pill .pd{width:8px;height:8px;border-radius:50%}
.status-pill.run .pd{background:#7ee0ff;box-shadow:0 0 8px #7ee0ff}
.status-pill.stop .pd{background:#ff5f6d}
.livepnl{font-size:30px;font-weight:700;text-shadow:0 0 18px rgba(126,224,255,.5)}
.flow{display:flex;flex-direction:column;gap:4px}
.fnode{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--stroke);border-radius:8px;background:var(--panel);position:relative}
.fnode .fdot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.fnode .flabel{font-size:13px;font-weight:600}
.fnode .fsub{font-size:10px;color:var(--dim)}
.flow .farrow{align-self:center;color:var(--dim);font-size:12px;line-height:1}
.pnl-rows{margin-top:10px}
.pnl-rows .pnl-row{display:flex;justify-content:space-between;font-size:12px;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.cfg-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;font-size:12px}
.cfg-row select,.cfg-row input{background:#0b1020;border:1px solid var(--stroke);border-radius:6px;color:var(--text);padding:5px 8px;font-family:inherit;font-size:12px;width:130px}
.rtabs{display:flex;gap:6px;margin-bottom:8px}
.rtab{padding:4px 10px;border-radius:7px;border:1px solid var(--stroke);font-size:11px;cursor:pointer;color:var(--dim);text-transform:capitalize}
.rtab.on{background:rgba(126,224,255,.12);color:#7ee0ff;border-color:rgba(126,224,255,.4)}
.rstatus{margin-bottom:8px;display:flex;flex-wrap:wrap;gap:5px}
.rscroll{max-height:320px;overflow-y:auto;border:1px solid var(--stroke);border-radius:8px;padding:6px}
.ridea{font-size:11px;padding:5px 6px;border-bottom:1px solid rgba(28,42,68,.5);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ridea .rid{color:var(--dim);font-family:ui-monospace}
.ridea .fam{color:var(--text)}
.ridea .st{font-size:9px;padding:1px 6px;border-radius:8px;border:1px solid var(--stroke)}
.st-pending{color:var(--dim)}
.st-in-backtest{color:#ffd479;border-color:rgba(255,212,121,.4)}
.st-in-ml{color:#ff9f43;border-color:rgba(255,159,67,.4)}
.st-in-validation{color:#9d7bff;border-color:rgba(157,123,255,.4)}
.st-approved{color:#7bed9f;border-color:rgba(123,237,159,.4)}
.st-graveyarded{color:#ff5f6d;border-color:rgba(255,95,109,.4)}
.ridea .hyp{width:100%;color:#8aa2c0;font-size:10px;margin-top:2px}
.ridea.grave{border-left:2px solid #ff5f6d}
.ridea .reason{color:#ff5f6d}
</style>
</head>
<body>
<div class="layout">
  <div class="sidebar">
    <div class="head"><h1>PRAXION CONTROL</h1><div class="sub">build v2.2026-10-08 — configurable · live</div></div>
    <div class="agents" id="agents"></div>
  </div>
  <div class="main">
    <div class="topbar"><span class="t" id="topbar-title">OVERVIEW</span><span class="stat" id="topbar-stat"></span><button class="cog" id="cog" onclick="toggleSettings()" title="Settings">⚙</button></div>
    <div class="graph-wrap" id="graphwrap"><span class="glabel" id="graph-label">Workflow</span><span class="graph-toggle" id="graph-toggle" onclick="toggleGraph()">▼ hide</span><canvas id="graph"></canvas></div>
    <div class="plwrap">
      <div class="fleet" id="fleet"><div class="fleethead"><span class="glabel">ORB Fleet</span><span class="fagen" id="fleet-age"></span></div><div id="fleet-rows" style="font-size:11px;color:var(--dim)">loading…</div></div>
      <div class="plhead"><span class="glabel">Projects · P&amp;L</span><span class="hiddenchip" id="hiddenchip" style="display:none" onclick="toggleHidden()"></span></div>
      <div class="hiddenpop" id="hiddenpop" style="display:none"></div>
      <div class="pnlsummary" id="pnlsummary"></div>
      <div class="plgrid" id="plgrid"></div>
    </div>
  </div>
</div>
<div class="chat" id="chat" style="display:none">
  <div class="chead"><span class="who" id="chat-who"></span><span class="x" onclick="closeChat()">✕</span></div>
  <div class="cbody" id="chat-body"></div>

/* ---- n8n-style flow: animated galaxy starfield + floating nodes + flowing electrodes ---- */
var selectedProject=null, selectedFlow=null;
var _flowNodes=[], _flowAnim=null, _stars=[];
function renderGraph(){
  var cvs=document.getElementById('graph');
  if(!cvs) return;
  var x=cvs.getContext('2d');
  var dpr=window.devicePixelRatio||1;
  var box=cvs.parentElement;
  var W=box.clientWidth, H=box.clientHeight;
  cvs.width=W*dpr; cvs.height=H*dpr; x.setTransform(dpr,0,0,dpr,0,0);

  // build nodes (selected flow OR overview stages)
  _flowNodes=[];
  var cols=['#ffd479','#7ee0ff','#ff9f43','#7bed9f','#9d7bff','#2dd4bf','#f368e0'];
  if(selectedFlow && selectedFlow.length){
    _flowNodes = selectedFlow.map(function(n,i){ return {label:n.label, sub:n.sub||'', color:cols[i%7], x:0, y:0, tx:0, ty:0}; });
  } else if(snap && snap.stages){
    _flowNodes = snap.stages.map(function(s,i){ return {label:s.label, sub:'', color:cols[i%7], x:0, y:0, tx:0, ty:0}; });
  }
  // lay out targets spread across width, vertically centred
  var n=_flowNodes.length;
  for(var i=0;i<n;i++){
    _flowNodes[i].tx = W*(i+1)/(n+1);
    _flowNodes[i].ty = H*0.5 + Math.sin(i*1.7)*10;
    if(!_flowNodes[i].x){ _flowNodes[i].x=_flowNodes[i].tx; _flowNodes[i].y=_flowNodes[i].ty; }
  }
  // stars (galaxy backdrop), seeded once
  if(!_stars.length){ for(var s=0;s<160;s++){ _stars.push({x:Math.random()*W, y:Math.random()*H, r:Math.random()*1.4+.2, tw:Math.random()*0.02+.005}); } }

  // start animation loop
  if(_flowAnim) cancelAnimationFrame(_flowAnim);
  var last=performance.now();
  function frame(now){
    var dt=Math.min(50, now-last); last=now;
    x.clearRect(0,0,W,H);
    // galaxy starfield
    for(var s=0;s<_stars.length;s++){
      var st=_stars[s];
      st.x += st.r*0.05;
      if(st.x>W) st.x=0;
      var a=0.4+0.6*Math.abs(Math.sin(now*st.tw));
      x.beginPath(); x.arc(st.x,st.y,st.r,0,7); x.fillStyle='rgba(180,210,255,'+a.toFixed(2)+')'; x.fill();
    }
    // electrodes flowing along connections (node i -> i+1)
    for(var i=0;i<_flowNodes.length-1;i++){
      var a=_flowNodes[i], b=_flowNodes[i+1];
      var seg=(now*0.004 + i*0.3)%1;
      var ex=a.x+(b.x-a.x)*seg, ey=a.y+(b.y-a.y)*seg;
      x.strokeStyle='rgba(126,224,255,.35)'; x.lineWidth=1; x.beginPath(); x.moveTo(a.x+38,a.y); x.lineTo(b.x-38,b.y); x.stroke();
      x.beginPath(); x.arc(ex,ey,2.2,0,7); x.fillStyle='#7ee0ff'; x.shadowColor='#7ee0ff'; x.shadowBlur=10; x.fill(); x.shadowBlur=0;
    }
    // floating nodes with gentle bob toward target
    for(var i=0;i<_flowNodes.length;i++){
      var nd=_flowNodes[i];
      nd.x += (nd.tx-nd.x)*0.06;
      nd.y += (nd.ty-nd.y)*0.06;
      var bob=Math.sin(now*0.001 + i)*4;
      var nx=nd.x, ny=nd.y+bob;
      // rounded node
      var w=88, h=34;
      x.save();
      x.shadowColor=nd.color; x.shadowBlur=16;
      x.fillStyle=nd.color; x.strokeStyle=nd.color; x.lineWidth=1;
      x.beginPath(); var r=9; x.moveTo(nx-w/2+r,ny-h/2); x.arcTo(nx+w/2,ny-h/2,nx+w/2,ny+h/2,r); x.arcTo(nx+w/2,ny+h/2,nx-w/2,ny+h/2,r); x.arcTo(nx-w/2,ny+h/2,nx-w/2,ny-h/2,r); x.arcTo(nx-w/2,ny-h/2,nx+w/2,ny-h/2,r); x.closePath();
      x.globalAlpha=.16; x.fill(); x.globalAlpha=1; x.stroke();
      x.shadowBlur=0;
      x.fillStyle='#fff';
      x.font='bold 11px ui-monospace'; x.textAlign='center';
      // wrap label to fit
      var lbl=nd.label.length>14 ? nd.label.slice(0,13)+'…' : nd.label;
      x.fillText(lbl, nx, ny+4);
      x.restore();
    }
    _flowAnim=requestAnimationFrame(frame);
  }
  _flowAnim=requestAnimationFrame(frame);
}

        .then(function(r){return r.json()}).then(function(d){ boot(); })
        .catch(function(){ boot(); });
    });
  });
  // open project detail when clicking the card (name OR anywhere else on the card)
  document.querySelectorAll('.pname[data-key]').forEach(function(n){

  });

    card.addEventListener('click', function(e){
      if(e.target.closest && e.target.closest('.hidebtn,.pval,.ctlbtn')) return;  // let inner controls handle it
      openDetail(card.getAttribute('data-key'));
    });
  });
  // marketdata collector: start/stop (hourly cron) + time scroll
  document.querySelectorAll('.mdctl[data-key]').forEach(function(b){
    b.addEventListener('click', function(e){
      e.stopPropagation();
      var key=b.getAttribute('data-key');
      var running=b.getAttribute('data-running')==='true';
      var enabled = !running;
      b.textContent = enabled ? '⏳ starting…' : '⏳ stopping…'; b.disabled = true;
      api('/api/marketdata/schedule',{enabled:enabled}).then(function(){ boot(); });
    });
  });
  document.querySelectorAll('.mdtime[data-key]').forEach(function(s){
    s.addEventListener('click', function(e){ e.stopPropagation(); });
    s.addEventListener('change', function(e){
      var key=s.getAttribute('data-key');
      var mm = Number(s.value);
      api('/api/marketdata/schedule',{scheduleMinute:mm}).then(function(){ boot(); });
    });
  });
  // start/stop button on project card
  document.querySelectorAll('.ctlbtn[data-key]').forEach(function(b){
    b.addEventListener('click', function(e){
      e.stopPropagation();
      var key=b.getAttribute('data-key');
      var running=b.getAttribute('data-running')==='true';
      var act=running?'stop':'start';
      fetch('/api/project/'+act,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:key})}).then(function(){boot();});
    });
  });
  // hide buttons
  document.querySelectorAll('.hidebtn').forEach(function(b){
    b.addEventListener('click', function(e){ e.stopPropagation(); api('/api/hide',{key:b.getAttribute('data-key')}).then(boot); });
  });
  // P&L edit (project boxes + member chips)
  document.querySelectorAll('.pval[data-key], .mpnl[data-key]').forEach(function(v){
    v.addEventListener('click', function(e){
      e.stopPropagation();
      var key=v.getAttribute('data-key');
      var cur = findPnl(key);
      var inp = prompt('Set P&L for '+key.split('::').pop()+'\n(number, or leave blank to reset to native)', cur==null?'':cur);
      if(inp===null) return;
      var val = inp.trim()==='' ? null : Number(inp);
      api('/api/project-pnl',{key:key, value:val}).then(boot);
    });
  });
  // folder rename
  document.querySelectorAll('.renamebtn').forEach(function(b){
    b.addEventListener('click', function(e){ e.stopPropagation();
      var id=b.getAttribute('data-group'); var g=snap.groups.find(function(x){return x.id===id});
      var n=prompt('Folder name', g?g.name:'');
      if(n) api('/api/group-rename',{groupId:id,name:n}).then(boot);
    });
  });
  // folder dissolve
  document.querySelectorAll('.delbtn').forEach(function(b){
    b.addEventListener('click', function(e){ e.stopPropagation();
      if(confirm('Dissolve this folder? (projects stay, just ungrouped)')) api('/api/group-delete',{groupId:b.getAttribute('data-group')}).then(boot);
    });
  });
  // drag & drop
  var grid=document.getElementById('plgrid');
  grid.addEventListener('dragover', function(e){ e.preventDefault(); });
  grid.addEventListener('drop', function(e){ e.preventDefault(); if(!dragKey) return; moveToGroup(dragKey,null); });
  document.querySelectorAll('.folder').forEach(function(f){
    f.addEventListener('dragover', function(e){ e.preventDefault(); e.stopPropagation(); f.classList.add('droptarget'); });
    f.addEventListener('dragleave', function(){ f.classList.remove('droptarget'); });
    f.addEventListener('drop', function(e){ e.preventDefault(); e.stopPropagation(); f.classList.remove('droptarget'); if(!dragKey) return; moveToGroup(dragKey, f.getAttribute('data-group')); });
  });
  document.querySelectorAll('.pbox[data-key]').forEach(function(b){
    b.addEventListener('dragover', function(e){ e.preventDefault(); e.stopPropagation(); });
    b.addEventListener('drop', function(e){ e.preventDefault(); e.stopPropagation(); if(!dragKey) return; var tk=b.getAttribute('data-key'); if(tk===dragKey) return; createGroup([dragKey, tk]); });
  });
  document.querySelectorAll('[draggable="true"]').forEach(function(el){
    el.addEventListener('dragstart', function(e){ dragKey=el.getAttribute('data-key'); el.classList.add('dragging'); });
    el.addEventListener('dragend', function(){ dragKey=null; el.classList.remove('dragging'); });
  });
}

function findPnl(key){
  var p=snap.projects.find(function(x){return x.key===key});
  if(p) return p.pnlValue;
  for(var i=0;i<snap.groups.length;i++){ var m=snap.groups[i].members.find(function(x){return x.key===key}); if(m) return m.pnlValue; }
  return null;
}

/* ---- ORB Fleet ---- */
var _fleetLast=0;
function fetchFleet(force){
  var now=Date.now();
  if(!force && now-_fleetLast<8000) return;
  _fleetLast=now;
  fetch('/api/fleet').then(function(r){return r.json()}).then(renderFleet).catch(function(){
    var el=document.getElementById('fleet-rows');
    if(el) el.innerHTML='<span style="color:#ff5f6d">fleet unavailable</span>';
  });
}
function fmtAge(s){
  if(s==null) return '—';
  if(s<60) return s+'s';
  if(s<3600) return Math.round(s/60)+'m';
  if(s<86400) return Math.round(s/3600)+'h';
  return Math.round(s/86400)+'d';
}
function renderFleet(d){
  var rows=document.getElementById('fleet-rows'); if(!rows) return;
  if(!d || !d.ok || !d.lanes || !d.lanes.length){
    rows.innerHTML='<span style="color:#ff5f6d">'+((d&&d.reason)||'no data')+'</span>';
    return;
  }
  var h='';
  d.lanes.forEach(function(L){
    var st=L.status||'red';
    // Prefer running balance (cash + open P&L) when the broker provides it.
    var balNum = (L.runningBalance!=null) ? L.runningBalance : L.balance;
    var bal = (balNum==null) ? '—' : money(balNum);
    var balCls = (balNum==null) ? '' : (balNum>=0?'pos':'neg');
    var pnl = L.openPnl;
    var pnlTxt = '';
    if (pnl != null && Math.abs(pnl) >= 0.005) {
      pnlTxt = '<div class="fpnl '+(pnl>=0?'pos':'neg')+'">'+(pnl>=0?'+':'')+money(pnl)+' open</div>';
    }
    h+='<div class="fleetrow">'
      +'<span class="fdot '+st+'" title="'+st+' — '+esc(L.name)+'"></span>'
      +'<span class="fname">'+esc(L.name)+'</span>'
      +'<span class="facct">'+esc(L.account||'—')+'</span>'
      +'<span class="fmeta">'
        +'<span class="'+(L.barsOk?'ok':'bad')+'">bars '+fmtAge(L.barAgeSec)+'</span><br>'
        +'<span class="'+(L.laneOk?'ok':'bad')+'">lane '+fmtAge(L.laneAgeSec)+'</span> · '
        +'<span class="'+(L.seeded?'ok':'warn')+'">'+(L.seeded?'seeded':'unseeded')+'</span>'
      +'</span>'
      +'<span class="fbal '+balCls+'">'+bal+pnlTxt+'</span>'
    +'</div>';
    if(L.note) h+='<div class="fnote">'+esc(L.note)+'</div>';
  });
  if(d.isolation){
    h+='<div class="fiso">credential isolation: <span class="'+(d.isolation.pass?'ok':'bad')+'">'+(d.isolation.pass?'PASS':'FAIL '+esc((d.isolation.offenders||[]).join(',')))+'</span></div>';
  }
  rows.innerHTML=h;
  var ag=document.getElementById('fleet-age');
  if(ag && d.ts) ag.textContent='upd '+new Date(d.ts*1000).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'});
}

/* ---- settings drawer ---- */
function renderSettings(){
  var body=document.getElementById('sdbody'); if(!body) return;
  var keys=(snap&&snap.projects)||[];
  var hidden={};
  ((snap&&snap.hidden)||[]).forEach(function(x){ hidden[x.key]=true; });
  var h='<div class="sdsec">Scorecards</div>';
  if(!keys.length) h+='<div style="font-size:11px;color:var(--dim)">no scorecards</div>';
  else keys.forEach(function(k){
    h+='<label class="sditem"><input type="checkbox" '+(hidden[k.key]?'':'checked')+' onchange="sdToggle(\''+k.key+'\',this.checked)"><span class="nm">'+esc(k.name)+'</span></label>';
  });
  h+='<div class="sdsec">Panels</div>';
  var gc=(localStorage.getItem('praxion.graphCollapsed')==='1');
  h+='<label class="sditem"><input type="checkbox" '+(gc?'':'checked')+' onchange="sdGraph(this.checked)"><span class="nm">Workflow graph</span></label>';
  h+='<label class="sditem"><input type="checkbox" '+(localStorage.getItem('praxion.fleetHidden')==='1'?'':'checked')+' onchange="sdFleet(this.checked)"><span class="nm">ORB Fleet status</span></label>';
  body.innerHTML=h;
}
function sdToggle(key, show){
  fetch(show?'/api/unhide':'/api/hide',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:key})})
    .then(function(){ return boot(); }).then(renderSettings).catch(function(){});
}
function sdGraph(show){
  var w=document.getElementById('graphwrap'), t=document.getElementById('graph-toggle');
  if(!w) return;
  var collapsed=!show;
  w.classList.toggle('collapsed', collapsed);
  if(t) t.textContent=collapsed?'▲ show':'▼ hide';
  try{ localStorage.setItem('praxion.graphCollapsed', collapsed?'1':'0'); }catch(e){}
}
function sdFleet(show){
  var f=document.getElementById('fleet'); if(!f) return;
  f.style.display = show ? '' : 'none';
  try{ localStorage.setItem('praxion.fleetHidden', show?'0':'1'); }catch(e){}
}
function sdShowAll(){
  var hidden=(snap&&snap.hidden)||[];
  if(!hidden.length){ renderSettings(); return; }
  Promise.all(hidden.map(function(x){
    return fetch('/api/unhide',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:x.key})});
  })).then(function(){ return boot(); }).then(renderSettings).catch(function(){});
}
function sdReset(){
  try{ localStorage.removeItem('praxion.graphCollapsed'); localStorage.removeItem('praxion.fleetHidden'); }catch(e){}
  sdGraph(true); sdFleet(true); sdShowAll();
}
function toggleSettings(){
  var d=document.getElementById('sdrawer'), bg=document.getElementById('sdbackdrop'), c=document.getElementById('cog');
  if(!d) return;
  var open=d.classList.toggle('open');
  if(bg) bg.classList.toggle('open', open);
  if(c) c.classList.toggle('active', open);
  if(open) renderSettings();
}
function closeSettings(){
  var d=document.getElementById('sdrawer'), bg=document.getElementById('sdbackdrop'), c=document.getElementById('cog');
  if(d) d.classList.remove('open');
  if(bg) bg.classList.remove('open');
  if(c) c.classList.remove('active');
}

boot(); setInterval(boot,10000);
</script>
</body>
</html>
